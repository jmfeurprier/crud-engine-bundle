jmf_crud_engine:

    schema:
        # Keys are the reusable naming vocabulary consumed by the patterns below
        # (form.type, helper, route, view). A full default set already exists
        # (EntityKey/entity_key/entitydashkeys/ActionKey/..., singular and plural);
        # values here are merged over those defaults, so only declare the deltas.
        #
        # A key pattern may reference the two source variables "entityClass" and "action"
        # (Twig + the String component "u.*" filters), but NOT another key.
        keys:
            # Example: drop pluralization so route paths read "article/..." not "articles/...".
            'entitydashkeys': "{{ entityClass|u.afterLast('\\\\').kebab }}"
            # Example: add a project-specific key, usable as "{{ EntityTitle }}" in any pattern.
            # "App\Entity\BlogPost" -> "Blog Post"
            'EntityTitle':    "{{ entityClass|u.afterLast('\\\\').snake.replace({'_': ' '}).title(true) }}"
        form:
            type:
                # "App\Form\FooBar\UpdateType"
                - "App\\Form\\{{ EntityKey }}\\{{ ActionKey }}Type"
                # "App\Form\FooBarUpdateType"
                - "App\\Form\\{{ EntityKey }}{{ ActionKey }}Type"
                # "App\Form\FooBarType"
                - "App\\Form\\{{ EntityKey }}Type"
        helper:
            # "App\Controller\FooBar\UpdateActionHelper"
            - "App\\Controller\\{{ EntityKey }}\\{{ ActionKey }}ActionHelper"
            # "App\Controller\FooBarUpdateActionHelper"
            - "App\\Controller\\{{ EntityKey }}{{ ActionKey }}ActionHelper"
        redirection:
            create:
                route: "{{ entity_key }}.read"
                parameters:
                    id: '{{ _entity.id }}'
            delete:
                route: "{{ entity_key }}.index"
            update:
                route: "{{ entity_key }}.read"
                parameters:
                    id: '{{ _entity.id }}'
        route:
            # "foo_bar.create"
            name: "{{ entity_key }}.{{ action }}"
            paths:
                # "foo-bars/create"
                create: "{{ entitydashkeys }}/create"
                # "foo-bars/{id}/delete"
                delete: "{{ entitydashkeys }}/{id}/delete"
                # "foo-bars"
                index:  "{{ entitydashkeys }}"
                # "foo-bars/{id}"
                read:   "{{ entitydashkeys }}/{id}"
                # "foo-bars/{id}/update"
                update: "{{ entitydashkeys }}/{id}/update"
        view:
            path: "{{ entity_key }}/{{ action }}.html.twig" # "foo_bar/update.html.twig"
            variables:
                entities:
                    - 'entities'
                    - "{{ entityKeys }}" # "fooBars"
                entity:
                    - 'entity'
                    - "{{ entityKey }}" # "fooBar"

    entities:
        App\Entity\Article:
            actions:
                create:
                    form:
                        type: 'App\Form\ArticleType'
                    redirection:
                        route: 'article.read'
                        parameters:
                            id: '{{ _entity.id }}'
                    route:
                        name: 'article.create'
                        path: '/articles/create'
                    view:
                        path: 'article/create.html.twig'
                delete:
                    redirection:
                        route: 'article.index'
                    route:
                        path: '/articles/{id}/delete'
                        requirements:
                            'id': !php/const Symfony\Component\Routing\Requirement\Requirement::UUID
                    view:
                        path: 'article/delete.html.twig'
                index:
                    route:
                        path: '/articles'
                    view:
                        path: 'article/index.html.twig'
                read:
                    helper: 'App\Controller\Article\ReadActionHelper'
                    route:
                        path: '/articles/{id}'
                        requirements:
                            'id': !php/const Symfony\Component\Routing\Requirement\Requirement::UUID
                    view:
                        path: 'article/read.html.twig'
                update:
                    form:
                        type: 'App\Form\ArticleType'
                    redirection:
                        fragment: 'content'
                        route:    'article.read'
                        parameters:
                            id: '{{ _entity.id }}'
                    route:
                        path: '/articles/{id}/update'
                        requirements:
                            'id': !php/const Symfony\Component\Routing\Requirement\Requirement::UUID
                    view:
                        path: 'article/update.html.twig'

