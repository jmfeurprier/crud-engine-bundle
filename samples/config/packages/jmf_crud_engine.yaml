jmf_crud_engine:

    view:
        naming:
            entities: "{{ entityClass|u.afterLast('\\').camel|plural }}"
            entity:   "{{ entityClass|u.afterLast('\\').camel }}"

    entities:
        App\Entity\Article:
            view:
                naming:
                    entities: 'articles'
                    entity:   'article'
                    form:     'form'
            actions:
                create:
                    formType: 'App\Form\ArticleType'
                    redirection:
                        route: 'article.read'
                        parameters:
                            id: '{{ _entity.id }}'
                    route:
                        path: '/articles/create'
                    view:
                        path: 'article/create.html.twig'
                delete:
                    redirection:
                        route: 'article.index'
                    route:
                        path: '/articles/{id}'
                        requirements:
                            'id': !php/const Symfony\Component\Routing\Requirement\Requirement::UUID
                index:
                    route:
                        path: '/articles'
                    view:
                        path: 'article/index.html.twig'
                read:
                    helper: 'App\Controller\Article\ReadActionHelper'
                    route:
                        path: '/articles/{id}'
                        requirements:
                            'id': !php/const Symfony\Component\Routing\Requirement\Requirement::UUID
                    view:
                        path: 'article/read.html.twig'
                update:
                    formType: 'App\Form\ArticleType'
                    redirection:
                        fragment: 'content'
                        route:    'article.read'
                        parameters:
                            id: '{{ _entity.id }}'
                    route:
                        path: '/articles/{id}/update'
                        requirements:
                            'id': !php/const Symfony\Component\Routing\Requirement\Requirement::UUID
                    view:
                        path: 'article/update.html.twig'

